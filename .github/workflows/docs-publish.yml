name: Publish Documentation

on:
  push:
    branches:
      - main
      - docs/publish
      - docs/code-documentation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build English documentation
        run: |
          python -m sphinx -b html docs/source docs/build/html

      - name: Build Ukrainian documentation
        run: |
          python -m sphinx -b html -D language=uk docs/source docs/build/html/uk

      - name: Create language landing page
        run: |
          cat > docs/build/html/languages.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Documentation Languages</title>
          </head>
          <body>
            <h1>Documentation / Документація</h1>
            <ul>
              <li><a href="./index.html">English</a></li>
              <li><a href="./uk/index.html">Українська</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
