name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [develop, deployment-docs]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -f dockerfile -t filesystem-mcp-server:ci .
