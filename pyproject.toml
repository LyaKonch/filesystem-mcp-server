[project]
name = "filesystem-mcp-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.2",
    "fastmcp>=2.14.1",
    "openpyxl>=3.1.5",
    "psutil>=7.1.3",
    "pymupdf>=1.27.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-docx>=1.2.0",
    "pywin32>=311",
    "redis>=7.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "locust>=2.42.6",
    "ruff>=0.15.5",
    "pre-commit>=4.3.0",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "tests"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"core_tools/BaseFilesystemManager.py" = ["B024"]
"core_tools/BaseServiceManager.py" = ["B024"]
"core_tools/OSManager.py" = ["B024"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
show_error_codes = true
explicit_package_bases = true
exclude = '^(tests|\.venv|__pycache__)/'
