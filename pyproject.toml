[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-mcp-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.2",
    "fastmcp>=2.14.1",
    "openpyxl>=3.1.5",
    "psutil>=7.1.3",
    "pydoclint>=0.8.3",
    "pydocstyle>=6.3.0",
    "pymupdf>=1.27.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-docx>=1.2.0",
    "redis>=7.1.0",
    "sphinx>=9.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "locust>=2.42.6",
    "ruff>=0.15.5",
    "pre-commit>=4.3.0",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "tests"
]

[tool.ruff.lint]
# "D" - Enable all `pydocstyle` rules, limiting to those that adhere to the Google convention via `convention = "google"`, below.
select = ["E", "F", "I", "UP", "B","D"]

# "D417" - On top of the Google convention, disable `D417`, which requires documentation for every function parameter.
ignore = ["E501","D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# Skip docstrings which fit on a single line.
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
show_error_codes = true
explicit_package_bases = true
exclude = '^(tests|\.venv|__pycache__)/'

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "utilities*", "resources*", "tools*"]
namespaces = true
